# Service Level Objectives (SLOs) and Service Level Agreements (SLAs)
# Veylan VisionOS - Titan Enhanced

---
# Global SLAs (Customer-Facing)
slas:
  availability:
    description: "System uptime and availability"
    target: 99.9%  # Three nines
    measurement_window: 30 days
    excluded_periods:
      - planned_maintenance
      - force_majeure
    consequences:
      breach_99_0: "10% monthly credit"
      breach_95_0: "25% monthly credit"
      breach_90_0: "50% monthly credit"

  latency:
    description: "API response time"
    targets:
      p95: 200ms
      p99: 500ms
    measurement_window: 30 days
    scope: "All user-facing API endpoints"

  data_durability:
    description: "Campaign data and creative assets durability"
    target: 99.999999999%  # Eleven nines (S3 standard)
    scope: "All stored data"

  support_response:
    description: "Support ticket response time"
    targets:
      critical: 1 hour
      high: 4 hours
      medium: 24 hours
      low: 72 hours
    business_hours: "24/7 for critical, 9-5 PT Mon-Fri for others"

---
# Internal SLOs (Engineering Targets)
slos:
  # Titan Memory Service
  titan_memory:
    availability:
      target: 99.95%
      measurement_window: 7 days
      error_budget: 21.6 minutes/month

    latency:
      query:
        p50: 50ms
        p95: 100ms
        p99: 200ms
      write:
        p50: 20ms
        p95: 50ms
        p99: 100ms

    freshness:
      description: "Time from data ingestion to queryable"
      target: < 5 minutes
      p99: < 10 minutes

    accuracy:
      vector_search:
        description: "Precision@10 for similarity search"
        target: 0.85
        minimum: 0.75

  # Strategy Agent
  strategy_agent:
    availability:
      target: 99.9%
      error_budget: 43.2 minutes/month

    latency:
      campaign_planning:
        p50: 15s
        p95: 30s
        p99: 60s
      optimization:
        p50: 5s
        p95: 10s
        p99: 20s

    quality:
      plan_success_rate:
        description: "% of plans that execute successfully"
        target: 95%
        minimum: 90%

  # Creative Agent
  creative_agent:
    availability:
      target: 99.9%

    latency:
      creative_generation:
        p50: 5s
        p95: 10s
        p99: 15s

    quality:
      brand_compliance:
        description: "% of generated creatives that pass brand DNA checks"
        target: 100%
        minimum: 99%

  # Trading Agent (Critical - RTB latency)
  trading_agent:
    availability:
      target: 99.99%  # Four nines (higher requirement)
      error_budget: 4.32 minutes/month

    latency:
      bid_decision:
        p50: 20ms
        p95: 50ms
        p99: 80ms
        max: 100ms  # Hard limit for RTB

    accuracy:
      win_rate:
        description: "Bid win rate at target CPM"
        target: 35%
        minimum: 25%

      bid_shading_effectiveness:
        description: "% savings vs unshaded bids"
        target: 15%
        minimum: 10%

  # BI Agent
  bi_agent:
    availability:
      target: 99.5%  # Lower requirement (not user-blocking)

    latency:
      report_generation:
        p50: 30s
        p95: 60s
        p99: 120s

      forecast:
        p50: 10s
        p95: 20s
        p99: 30s

    accuracy:
      forecast_error:
        description: "MAPE for 7-day forecasts"
        target: < 15%
        maximum: 25%

  # MIRAS Optimizer
  miras:
    availability:
      target: 99.9%

    latency:
      optimization:
        p50: 30s
        p95: 60s
        p99: 120s

    quality:
      convergence_rate:
        description: "% of optimizations that find Pareto solutions"
        target: 95%
        minimum: 85%

  # Outcome Layer (VCF/DVF)
  outcome_layer:
    availability:
      target: 99.95%

    latency:
      vcf_creation:
        p50: 100ms
        p95: 300ms
        p99: 500ms

      dvf_update:
        p50: 500ms
        p95: 1s
        p99: 2s

    accuracy:
      attribution_confidence:
        description: "Average confidence score for causal attribution"
        target: 0.80
        minimum: 0.70

      dvf_prediction_error:
        description: "MAPE for DVF predictions (7-day horizon)"
        target: < 20%
        maximum: 30%

  # Data Pipeline
  data_pipeline:
    availability:
      target: 99.9%

    latency:
      ingestion:
        batch: < 1 hour
        streaming: < 5 minutes

    quality:
      data_completeness:
        description: "% of expected data received"
        target: 99.5%
        minimum: 98%

      validation_pass_rate:
        description: "% of data passing validation"
        target: 99%
        minimum: 95%

---
# Error Budgets
error_budgets:
  calculation:
    # Error budget = (1 - SLO) * measurement_window
    # Example: 99.9% over 30 days = 43.2 minutes

  burn_rate_alerts:
    fast_burn:
      description: "Alert if error budget will be exhausted in < 2 days"
      threshold: 14.4  # 14.4x normal burn rate
      window: 1 hour

    slow_burn:
      description: "Alert if error budget will be exhausted in < 7 days"
      threshold: 6  # 6x normal burn rate
      window: 6 hours

  policies:
    - name: "Feature freeze on error budget depletion"
      trigger: "Error budget < 10%"
      action: "Freeze non-critical feature releases until budget restored"

    - name: "Oncall escalation"
      trigger: "Error budget < 5%"
      action: "Escalate to engineering leadership"

    - name: "Postmortem required"
      trigger: "Error budget < 0% (SLA breach)"
      action: "Mandatory postmortem within 48 hours"

---
# Monitoring & Alerting
monitoring:
  dashboards:
    - name: "SLO Dashboard"
      url: "https://grafana.veylan.com/d/slo"
      update_frequency: "Real-time"
      panels:
        - Error budget remaining (all services)
        - Burn rate (1h, 6h, 1d, 7d)
        - Latency percentiles
        - Availability (7d, 30d)

  alerts:
    critical:
      - SLO breach imminent (< 10% error budget)
      - Fast burn rate detected
      - Multiple service degradation

    warning:
      - Approaching SLO limits (< 25% error budget)
      - Slow burn rate detected
      - Single service degradation

    info:
      - Error budget reports (weekly)
      - SLO compliance reports (monthly)

---
# Review & Adjustment
review_process:
  frequency: Quarterly

  considerations:
    - Actual vs target performance
    - Customer expectations
    - Business requirements
    - Engineering cost/benefit

  adjustment_triggers:
    tighten_slo:
      - Consistently exceeding target by >20%
      - Customer feedback requests higher reliability
      - Competitive pressure

    loosen_slo:
      - Consistently missing target
      - Unreasonable cost to achieve
      - No customer impact from current performance

---
# SLO Compliance Targets (Quarterly)
compliance_targets:
  q1_2026:
    titan_memory_availability: 99.95%
    trading_agent_latency_p95: 50ms
    overall_system_availability: 99.9%

  q2_2026:
    titan_memory_availability: 99.97%
    trading_agent_latency_p95: 45ms
    overall_system_availability: 99.95%

  q3_2026:
    titan_memory_availability: 99.99%
    trading_agent_latency_p95: 40ms
    overall_system_availability: 99.95%

  q4_2026:
    # Maintain Q3 levels, focus on cost optimization
    titan_memory_availability: 99.99%
    trading_agent_latency_p95: 40ms
    overall_system_availability: 99.95%
